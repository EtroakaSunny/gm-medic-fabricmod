# Overlay for running next to New-GM-API-Burner on the same host, sharing its
# ingress. The bundled caddy service stays off (COMPOSE_PROFILES=) and the app
# joins the burner's compose network instead, reachable there as "gm-medic".
#
# Routing, depending on the burner's mode:
#   - tunnel (cloudflared): add a public hostname to the named tunnel in the
#     Cloudflare Zero Trust dashboard:
#       medic.dorikku.de -> http://gm-medic:8765
#     (this also creates the DNS record; Cloudflare terminates TLS)
#   - production (Caddy on 80/443): add to the burner's Caddyfile:
#       medic.dorikku.de { reverse_proxy gm-medic:8765 }
#
# Enable by setting in .env:
#   COMPOSE_PROFILES=
#   COMPOSE_FILE=docker-compose.yml:docker-compose.burner.yml
services:
  app:
    networks:
      default: {}
      burner:
        aliases:
          - gm-medic

networks:
  burner:
    external: true
    name: ${BURNER_NETWORK:-new-gm-api-burner_default}
