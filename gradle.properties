# Done to increase the memory available to gradle.
org.gradle.jvmargs=-Xmx1G
org.gradle.parallel=true

# IntelliJ IDEA is not yet fully compatible with configuration cache, see: https://github.com/FabricMC/fabric-loom/issues/1349
org.gradle.configuration-cache=false

# Fabric Properties
# check these on https://fabricmc.net/develop
minecraft_version=1.21.10
yarn_mappings=1.21.10+build.3
loader_version=0.18.4
loom_version=1.15-SNAPSHOT

# Mod Properties
mod_version=0.1.3-HOTFIX-beta
maven_group=de.dorikku.gmmedicmod
archives_base_name=gm-medic

# When true (default), every feature (vehicle automation, siren, HUD, call tracking)
# stays locked until the GM-Medic API server has verified the player. Build the
# unrestricted variant with -Prequire_verification=false (see README).
require_verification=true

# Dependencies
fabric_api_version=0.138.4+1.21.10